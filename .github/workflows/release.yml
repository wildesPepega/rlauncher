name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/rlauncher
          cp target/release/rlauncher target/release/rlauncher-toggle README.md LICENSE dist/rlauncher/
          cp -r data dist/rlauncher/
          tar -C dist -czf rlauncher-${{ matrix.arch }}-linux.tar.gz rlauncher
      - uses: actions/upload-artifact@v4
        with:
          name: rlauncher-${{ matrix.arch }}-linux
          path: rlauncher-${{ matrix.arch }}-linux.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: rlauncher-*-linux.tar.gz
          generate_release_notes: true
